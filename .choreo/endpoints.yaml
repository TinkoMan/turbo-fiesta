openapi: 3.0.0
info:
  title: Bhajan Video Pipeline API
  version: 1.0.0
paths:
  /api/v1/tasks:
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      responses:
        '200':
          description: Task created
  /api/v1/tasks/{task_id}:
    get:
      summary: Get task status
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
